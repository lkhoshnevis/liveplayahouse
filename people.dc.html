<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="./support.js"></script>
<script src="./analytics.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{overflow-x:hidden;overscroll-behavior-y:none}
body{margin:0;background:#fff;overflow-x:hidden;overscroll-behavior-y:none}
#dc-root,#dc-root>.sc-host{height:auto!important;min-height:0!important}
.page{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#161616;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:620px;margin:0 auto;padding:calc(76px + env(safe-area-inset-top,0px)) 24px 32px}
.sec{font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:24px;line-height:1.3;font-weight:400;color:#161616;margin:0 0 6px;letter-spacing:-.005em}
.rule{height:1px;background:#ebebeb;border:0;margin:18px 0}
.group-label{font-family:'Newsreader',Georgia,serif;font-size:20px;color:#161616;margin:0 0 4px;font-style:italic}
.group-desc{font-size:14px;line-height:1.5;color:#949494;margin:0 0 10px}
.group-photos-row{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}
.group-photo-frame{aspect-ratio:1;overflow:hidden}
.group-photo-frame img{width:100%;height:100%;object-fit:cover;display:block}
.people-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;margin:0 0 4px;align-items:start}
.flip-card{perspective:1000px;aspect-ratio:1}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.15,.2,1);transform-style:preserve-3d}
.flip-card:hover .flip-inner,.flip-card:focus-within .flip-inner{transform:rotateY(180deg)}
.flip-face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid rgba(0,0,0,.12);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;text-align:center}
.flip-front{position:relative;height:100%}
.flip-back{position:absolute;inset:0;background:#161616;border-color:rgba(255,255,255,.15);transform:rotateY(180deg);justify-content:space-between}
.face-photo{width:148px;height:148px;object-fit:contain;margin-bottom:8px;flex-shrink:0}
.face-name{font-family:'Newsreader',Georgia,serif;font-size:14px;color:#161616;margin:0;line-height:1.3}
.affiliation-badge{font-size:10px;font-weight:400;color:#a89452;background:#faf9f5;border:1px solid #ece6d4;border-radius:999px;padding:2px 7px;margin-top:6px;line-height:1.35;white-space:nowrap}
.back-desc{font-size:12px;line-height:1.5;color:#dcdcdc;margin:0;flex:1;display:flex;align-items:center;justify-content:center}
.back-link{font-size:11px;color:#fff;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;flex-shrink:0}
.site-head{position:fixed;left:0;right:0;top:0;background:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 0 18px;border-bottom:1px solid #ebebeb;text-align:center;z-index:20}
.bottom-nav{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}
.nav-link{font-family:'Newsreader',Georgia,serif;font-size:16px;color:#949494;text-decoration:none}
.nav-link.active{color:#161616;font-style:italic;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.apply-pill{font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:600;color:#fff;background:#161616;text-decoration:none;padding:7px 16px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;transition:background .2s ease}
.apply-pill:hover{background:#333}
.apply-pill .arr{font-size:12px}
</style>
</helmet>
<header class="site-head">
<nav class="bottom-nav">
<a class="nav-link" href="/">Home</a>
<a class="nav-link active" href="/people">People</a>
<a class="nav-link" href="/house">House</a>
<a class="nav-link" href="/future">Future</a>
<a class="nav-link" href="sms:+19258869041">Contact</a>
<a class="apply-pill" href="https://docs.google.com/forms/d/e/1FAIpQLSdrfGH5jGOf2llhQDCDcNOfNPTflyy2U-9KcLf6RoJwIA5qqg/viewform?usp=dialog" target="_blank" rel="noopener noreferrer">Apply now<span class="arr">→</span></a>
</nav>
</header>
<div class="page"><div class="wrap">

<h2 class="sec">People</h2>

<sc-for list="{{ groups }}" as="group">
<p class="{{ group.labelClass }}">{{ group.label }}</p>
<sc-if value="{{ group.desc }}"><p class="group-desc">{{ group.desc }}</p></sc-if>
<div class="people-grid">
<sc-for list="{{ group.people }}" as="person">
<div class="flip-card">
<div class="flip-inner">
<div class="flip-face flip-front">
<sc-if value="{{ person.photo }}"><img class="face-photo" src="{{ person.photo }}" alt="{{ person.name }}"></sc-if>
<p class="face-name">{{ person.name }}</p>
<sc-if value="{{ person.showUcsbBadge }}"><span class="affiliation-badge">UCSB alum</span></sc-if>
</div>
<div class="flip-face flip-back">
<p class="back-desc">{{ person.backDesc }}</p>
<sc-if value="{{ person.href }}"><a class="back-link" href="{{ person.href }}" target="_blank" rel="noopener noreferrer">View →</a></sc-if>
</div>
</div>
</div>
</sc-for>
</div>
<hr class="rule">
</sc-for>

<div class="group-photos-row">
<div class="group-photo-frame"><img src="./assets/people/team.png" alt="Playa House team at New Venture Competition"></div>
<div class="group-photo-frame"><img src="./assets/people/group-work.png" alt="Residents working together at Playa House"></div>
<div class="group-photo-frame"><img src="./assets/people/group-photo.jpg" alt="Playa House group photo"></div>
</div>

</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  normalizeUrl(url) {
    if (!url) return null;
    const trimmed = String(url).trim();
    if (!trimmed) return null;
    return /^https?:\/\//i.test(trimmed) ? trimmed : "https://" + trimmed;
  }

  groups = [
    {
      label: "Cohort 02 — 2026–27",
      desc: null,
      labelClass: "group-label",
      people: [
        { name: "Leon Khoshnevis", photo: "./assets/headshots/Leon.png", description: "Founder of Playa House — backed the first 8 students from UCSB to get into Y Combinator.", href: null },
        { name: "Joaquin Del Pego", photo: "./assets/headshots/Joaquinn.png", description: "Highschool valedictorian, 2026 UCSB NVC 1st place winner, and founder of Legaltime AI — changing the way law firms work.", href: "legaltime.ai" },
        { name: "Kay Aryamehr", photo: "./assets/headshots/Kay.png", description: "Datathon 1st place winner with experience in MEMS and photonic processing; founder of Amniotide, building foundation models for proteins and RNA.", href: "https://amniotide.info/" },
        { name: "Evan McCall", photo: "./assets/headshots/evan.avif", description: "2025 UCSB NVC 1st place winner and founder of Razemath, an AI-powered tutoring platform.", href: null },
        { name: "Preston Brown", photo: "./assets/headshots/preston.png", description: "Built dev tools for 5+ years; founder of Peko, an end-to-end app review tool.", href: "https://www.linkedin.com/in/preston-brown-581926353/" },
        { name: "Avi Shah", photo: "./assets/headshots/avi.png", description: "", href: null },
        { name: "Ritvik Sharma", photo: null, description: "", href: null },
        { name: "Tobias Von Koch", photo: "./assets/headshots/tobias.avif", description: "", href: null },
        { name: "Sebastian Vaughan", photo: "./assets/headshots/sebastian.avif", description: "", href: null },
      ],
    },
    {
      label: "Alumni 01",
      desc: null,
      labelClass: "group-label",
      people: [
        { name: "Kautilya P", photo: "./assets/headshots/Nag.png", description: "Previously founded a recruiting-tech startup; now founder of Cafx, building autonomous workers for cafes.", href: "https://www.cafx.me/" },
        { name: "Arthur Garzon", photo: "./assets/headshots/Arthur.png", description: "Built 30+ drones and demoed to the Pentagon; EF-backed founder of Narion, building aerial manipulation drones.", href: "https://www.narion.tech/" },
      ],
    },
    {
      label: "Collaborators",
      desc: "People who have been an integral part of our network.",
      labelClass: "group-label",
      people: [
        { name: "Hursh Shah", photo: "./assets/headshots/Hursh.png", description: "Founder of Edviro (YC)", href: "https://www.linkedin.com/in/hursh-shah/?skipRedirect=true" },
        { name: "Tanuj Siripurapu", photo: "./assets/headshots/Tanuj.png", description: "Founder of Edviro (YC)", href: "https://www.linkedin.com/in/tanuj-siripurapu/?skipRedirect=true" },
        { name: "Bryan Hong", photo: null, description: "Co-founder of Shofo AI (YC)", href: "https://www.linkedin.com/in/zixihong/" },
        { name: "Nader Khalil", photo: null, description: "Founder of Brev · NVIDIA director", href: "https://www.linkedin.com/in/naderlikeladder/" },
        { name: "Ryan Mcentush", photo: null, description: "A16Z Partner (American Dynamism)", href: "https://www.linkedin.com/in/ryanmcentush/" },
        { name: "Mike Rosengarten", photo: null, description: "Co-founder of Opengov · GP Builders VC", href: "https://www.linkedin.com/in/michaelrosengarten/" },
        { name: "Nick Malone", photo: null, description: "President of Protagonist VC", href: "https://www.linkedin.com/in/njmalone26/" },
        { name: "Nick Linck", photo: null, description: "Founder of the residency", href: "https://www.linkedin.com/in/nick-linck-417b0ba9/?skipRedirect=true" },
        { name: "Quinn Godfredsen", photo: "./assets/headshots/Quinn.png", description: "Top global League of Legends player, SBHacks 1st place winner, and founder of Legaltime AI — changing the way law firms work.", href: null },
        { name: "Stanton Nowinski", photo: "./assets/headshots/Stanton.png", description: "Top global chess player, Datathon 1st place winner, and founder of Amniotide, building foundation models for proteins and RNA.", href: null },
        { name: "John Lins", photo: "./assets/headshots/John.png", description: "Lead research author at LLNL and founder of Repclose, building deep research agents for lead generation.", href: null },
        { name: "Ivan Bercovich", photo: null, description: "GP of ScOp VC", href: "https://www.linkedin.com/in/bercovich/", ucsbAlum: true },
      ],
    },
  ];

  renderVals() {
    const groups = this.groups.map(group => ({
      ...group,
      people: (group.label === "Collaborators"
        ? [...group.people].sort((a, b) => (b.photo ? 1 : 0) - (a.photo ? 1 : 0))
        : group.people
      ).map(person => ({
        ...person,
        href: this.normalizeUrl(person.href),
        backDesc: person.description || person.name,
        showUcsbBadge: !!person.ucsbAlum,
      })),
    }));
    return { groups };
  }
}
</script>
</body>
</html>
